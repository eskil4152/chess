spring:
  application:
    name: chess
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chess}
    username: ${SPRING_DATASOURCE_USERNAME:eskil}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    placeholders:
      admin_password: ${admin.password}

app:
  jwt:
    secret: ${JWT_SECRET:superSecretKeyForTheDevelopmentWhichIsAbsolutelySecureEnoughAndFarEnoughBitsToBeAbleToBeMadeIntoASecureEnoughKey}

rate-limit:
  login:
    max-tokens: ${LOGIN_TOKENS:1000}
  register:
    max-tokens: ${REGISTER_TOKENS:1000}
  other:
    max-tokens: ${OTHER_TOKENS:1000}

admin:
  password: ${ADMIN_PASSWORD}