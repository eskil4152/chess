services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: eskil
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  app1:
    build: .
    environment:
      INSTANCE_ID: app1
      OTEL_SDK_DISABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chess
      SPRING_DATA_REDIS_URL: redis://redis:6379
    ports:
      - "8081:8080"

  app2:
    build: .
    environment:
      INSTANCE_ID: app2
      OTEL_SDK_DISABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chess
      SPRING_DATA_REDIS_URL: redis://redis:6379
    ports:
      - "8082:8080"

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - app1
      - app2