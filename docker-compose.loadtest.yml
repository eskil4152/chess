services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chess"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    entrypoint: ["java", "-jar", "app.jar"]
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/chess
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: superSecretKeyForTheDevelopmentWhichIsAbsolutelySecureEnoughAndFarEnoughBitsToBeAbleToBeMadeIntoASecureEnoughKey
      LOGIN_TOKENS: "100000000"
      REGISTER_TOKENS: "100000000"
      OTHER_TOKENS: "100000000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      BASE_URL: http://app:8080
    working_dir: /scripts
    volumes:
      - ./src/test/java/com/blikeng/chess/k6:/scripts