spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-64-bytes-long-for-testing-purposes-only-here
  prometheus:
    token: "test token"

rate-limit:
  login:
    max-tokens: 1000
  register:
    max-tokens: 1000
  other:
    max-tokens: 1000